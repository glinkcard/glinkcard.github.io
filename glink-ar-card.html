<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Garland Miller — G-Link Card AR</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow: hidden; background: #000; font-family: "Rajdhani", sans-serif; }

    #loader {
      position: fixed; inset: 0;
      background: #020508;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999; gap: 24px;
      transition: opacity 1s ease;
    }
    #loader.hide { opacity: 0; pointer-events: none; }

    .loader-ring {
      width: 110px; height: 110px; border-radius: 50%;
      border: 2px solid #50C8FF;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      animation: ringPulse 2s ease-in-out infinite;
      box-shadow: 0 0 30px rgba(80,200,255,0.4);
    }
    @keyframes ringPulse {
      0%,100% { box-shadow: 0 0 20px rgba(80,200,255,0.25); }
      50%      { box-shadow: 0 0 55px rgba(80,200,255,0.70); }
    }
    .loader-ring img { width: 100%; object-fit: contain; }

    .loader-title {
      font-family: "Cormorant Garamond", serif;
      font-size: 30px; font-weight: 300;
      letter-spacing: 10px; color: #fff;
      text-transform: uppercase;
    }
    .loader-sub {
      font-size: 9px; font-weight: 600;
      letter-spacing: 5px; color: rgba(80,200,255,0.55);
      text-transform: uppercase; text-align: center;
      padding: 0 48px; line-height: 2;
    }
    .loader-bar {
      width: 220px; height: 2px;
      background: rgba(80,200,255,0.12);
      border-radius: 2px; overflow: hidden;
    }
    .loader-progress {
      height: 100%;
      background: linear-gradient(90deg, #50C8FF, #90DEFF);
      width: 0%; transition: width 0.3s ease;
    }
    .loader-status {
      font-size: 8px; font-weight: 500;
      letter-spacing: 3px; color: rgba(80,200,255,0.35);
      text-transform: uppercase;
    }

    /* Scan prompt */
    #scanPrompt {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: flex; flex-direction: column;
      align-items: center; gap: 16px;
      z-index: 100;
      pointer-events: none;
      opacity: 1; transition: opacity 0.5s ease;
    }
    #scanPrompt.hide { opacity: 0; }

    .scan-frame {
      width: 200px; height: 200px;
      border: 1px solid rgba(80,200,255,0.40);
      border-radius: 8px; position: relative;
      animation: scanPulse 2s ease-in-out infinite;
    }
    @keyframes scanPulse {
      0%,100% { border-color: rgba(80,200,255,0.30); }
      50%      { border-color: rgba(80,200,255,0.80); }
    }
    .scan-corner {
      position: absolute; width: 20px; height: 20px;
    }
    .scan-corner.tl { top:-1px; left:-1px; border-top:2px solid #50C8FF; border-left:2px solid #50C8FF; border-radius:4px 0 0 0; }
    .scan-corner.tr { top:-1px; right:-1px; border-top:2px solid #50C8FF; border-right:2px solid #50C8FF; border-radius:0 4px 0 0; }
    .scan-corner.bl { bottom:-1px; left:-1px; border-bottom:2px solid #50C8FF; border-left:2px solid #50C8FF; border-radius:0 0 0 4px; }
    .scan-corner.br { bottom:-1px; right:-1px; border-bottom:2px solid #50C8FF; border-right:2px solid #50C8FF; border-radius:0 0 4px 0; }

    .scan-line {
      position: absolute; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, #50C8FF, transparent);
      animation: scanLine 2s ease-in-out infinite;
    }
    @keyframes scanLine {
      0%   { top: 0%; opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    .scan-text {
      font-size: 9px; font-weight: 600;
      letter-spacing: 4px; color: rgba(80,200,255,0.60);
      text-transform: uppercase; text-align: center;
    }

    /* HUD bottom */
    #hud {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 12px 24px 40px;
      background: linear-gradient(180deg, transparent, rgba(2,5,8,0.75));
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      z-index: 100; pointer-events: none;
    }
    .hud-line { width: 40px; height: 1px; background: rgba(80,200,255,0.30); }
    .hud-text { font-size: 7px; font-weight: 600; letter-spacing: 4px; color: rgba(80,200,255,0.35); text-transform: uppercase; }
    .hud-brand { font-family: "Cormorant Garamond", serif; font-size: 13px; font-weight: 300; letter-spacing: 6px; color: rgba(80,200,255,0.25); text-transform: uppercase; }

    /* View card button overlay */
    #viewCardBtn {
      position: fixed;
      bottom: 100px; left: 50%;
      transform: translateX(-50%);
      padding: 16px 48px;
      background: linear-gradient(135deg, rgba(80,200,255,0.20), rgba(80,200,255,0.10));
      border: 1px solid rgba(80,200,255,0.50);
      border-radius: 50px;
      font-size: 11px; font-weight: 700;
      letter-spacing: 4px; color: #fff;
      text-transform: uppercase;
      cursor: pointer; z-index: 200;
      display: none;
      animation: btnGlow 2s ease-in-out infinite alternate;
      box-shadow: 0 0 20px rgba(80,200,255,0.20);
    }
    @keyframes btnGlow {
      0%   { box-shadow: 0 0 15px rgba(80,200,255,0.15); }
      100% { box-shadow: 0 0 35px rgba(80,200,255,0.45); }
    }
  </style>
</head>

<script>
var progress = 0;
var progressBar = document.getElementById('loaderProgress');
var statusText = document.getElementById('loaderStatus');
var scanPrompt = document.getElementById('scanPrompt');
var viewBtn = document.getElementById('viewCardBtn');

// Simulate loading progress
var messages = [
  'Initializing AR Engine...',
  'Loading Camera...',
  'Calibrating Tracker...',
  'Ready to Scan!'
];
var msgIndex = 0;

var interval = setInterval(function() {
  progress += 8;
  progressBar.style.width = Math.min(progress, 95) + '%';
  if (msgIndex < messages.length - 1) {
    statusText.textContent = messages[Math.floor(progress / 25)];
    msgIndex++;
  }
  if (progress >= 95) clearInterval(interval);
}, 200);

// When AR scene loads
document.querySelector('a-scene').addEventListener('loaded', function() {
  progressBar.style.width = '100%';
  statusText.textContent = 'Ready to Scan!';
  setTimeout(function() {
    document.getElementById('loader').classList.add('hide');
    setTimeout(function() {
      document.getElementById('loader').style.display = 'none';
    }, 1000);
  }, 800);
});

// When target found — show View Card button
document.querySelector('a-scene').addEventListener('targetFound', function() {
  scanPrompt.classList.add('hide');
  viewBtn.style.display = 'block';
});

// When target lost — hide button
document.querySelector('a-scene').addEventListener('targetLost', function() {
  scanPrompt.classList.remove('hide');
  viewBtn.style.display = 'none';
});
</script>
