const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const S = 3;
const W = 420 * S;
const H = 747 * S;

function drawStory(logoImg) {
  ctx.clearRect(0,0,W,H);

  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#060C1A'); bg.addColorStop(0.3,'#0B1828');
  bg.addColorStop(0.7,'#081220'); bg.addColorStop(1,'#040810');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  const lg=ctx.createRadialGradient(0,H*0.35,0,0,H*0.35,W*0.55);
  lg.addColorStop(0,'rgba(15,70,150,0.20)'); lg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=lg; ctx.fillRect(0,0,W,H);
  const rg=ctx.createRadialGradient(W,H*0.65,0,W,H*0.65,W*0.55);
  rg.addColorStop(0,'rgba(15,70,150,0.16)'); rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);

  for(let y=0;y<H;y+=S*3){ ctx.fillStyle='rgba(0,0,0,0.025)'; ctx.fillRect(0,y,W,S); }

  [[28,35],[80,18],[155,28],[222,10],[290,24],[345,40],[365,90],[12,140],[380,160],[130,60],[310,70],[60,200],[340,220],[195,44],[55,290],[370,300]].forEach(([x,y])=>{
    ctx.beginPath(); ctx.arc(x*S,y*S,S*0.9,0,Math.PI*2);
    ctx.fillStyle='rgba(180,220,255,0.5)'; ctx.fill();
  });

  function hGrad(op){
    const g=ctx.createLinearGradient(0,0,W,0);
    g.addColorStop(0,'rgba(80,200,255,0)');
    g.addColorStop(0.5,`rgba(80,200,255,${op})`);
    g.addColorStop(1,'rgba(80,200,255,0)');
    return g;
  }

  // TOP BAR
  ctx.fillStyle='rgba(3,7,16,0.90)'; ctx.fillRect(0,0,W,62*S);
  ctx.strokeStyle=hGrad(0.5); ctx.lineWidth=S*0.8;
  ctx.beginPath(); ctx.moveTo(0,62*S); ctx.lineTo(W,62*S); ctx.stroke();

  ctx.textAlign='left';
  ctx.font=`900 ${S*17}px "Arial Narrow",Arial,sans-serif`;
  ctx.fillStyle='#50C8FF'; ctx.fillText('G+', S*18, S*39);
  const gpW=ctx.measureText('G+').width;
  ctx.fillStyle='#FFFFFF'; ctx.fillText('LINK CARD', S*18+gpW+S*1, S*39);
  const linkW=ctx.measureText('LINK CARD').width;
  ctx.font=`700 ${S*8}px Arial,sans-serif`;
  ctx.fillStyle='rgba(80,200,255,0.80)';
  ctx.fillText('™', S*18+gpW+S*1+linkW+S*2, S*28);
  ctx.font=`300 ${S*9}px "Arial Narrow",Arial,sans-serif`;
  ctx.fillStyle='rgba(80,200,255,0.50)'; ctx.fillText('Digital Business Cards', S*18, S*53);
  ctx.textAlign='right';
  ctx.font=`300 ${S*8}px "Arial Narrow",Arial,sans-serif`;
  ctx.fillStyle='rgba(80,200,255,0.42)'; ctx.fillText('FOR THE ELITE PROFESSIONAL', W-S*14, S*37);
  ctx.fillStyle='rgba(80,200,255,0.30)'; ctx.fillText('glinkcard.com', W-S*14, S*51);

  // LOGO RING
  const cx=W/2, cy=S*228, RING=S*94;

  const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,RING*1.4);
  cg.addColorStop(0,'rgba(20,90,190,0.20)'); cg.addColorStop(0.6,'rgba(15,70,160,0.06)'); cg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(cx,cy,RING*1.4,0,Math.PI*2); ctx.fill();

  ctx.beginPath(); ctx.arc(cx,cy,RING,0,Math.PI*2);
  ctx.strokeStyle='rgba(80,200,255,0.18)'; ctx.lineWidth=S*14; ctx.stroke();

  ctx.beginPath(); ctx.arc(cx,cy,RING,0,Math.PI*2);
  const ringG=ctx.createLinearGradient(cx-RING,cy,cx+RING,cy);
  ringG.addColorStop(0,'rgba(50,170,230,0.75)'); ringG.addColorStop(0.3,'rgba(80,200,255,1)');
  ringG.addColorStop(0.5,'rgba(110,225,255,1)'); ringG.addColorStop(0.7,'rgba(80,200,255,1)');
  ringG.addColorStop(1,'rgba(50,170,230,0.75)');
  ctx.strokeStyle=ringG; ctx.lineWidth=S*2.5; ctx.stroke();

  const tg=ctx.createRadialGradient(cx,cy-RING,0,cx,cy-RING,S*12);
  tg.addColorStop(0,'rgba(210,245,255,1)'); tg.addColorStop(0.4,'rgba(140,225,255,0.7)'); tg.addColorStop(1,'rgba(80,200,255,0)');
  ctx.fillStyle=tg; ctx.fillRect(cx-S*12,cy-RING-S*12,S*24,S*24);

  if(logoImg){
    const ls=RING*2-S*6;
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,RING-S*3,0,Math.PI*2); ctx.clip();
    ctx.drawImage(logoImg,cx-ls/2,cy-ls/2,ls,ls); ctx.restore();
  }

  // FOUNDER & CEO
  ctx.font=`600 ${S*11}px "Arial Narrow",Arial,sans-serif`;
  const fLetters='FOUNDER & CEO'.split('');
  let fTotal=0;
  fLetters.forEach(ch=>{ fTotal+=ctx.measureText(ch).width+S*4; }); fTotal-=S*4;
  let fx=cx-fTotal/2;
  ctx.textAlign='left';
  fLetters.forEach(ch=>{
    ctx.fillStyle='#50C8FF'; ctx.fillText(ch,fx,S*348);
    fx+=ctx.measureText(ch).width+S*4;
  });

  ctx.textAlign='center';
  ctx.font=`300 ${S*46}px Georgia,"Times New Roman",serif`;
  ctx.fillStyle='#FFFFFF'; ctx.fillText('Garland Miller', cx, S*396);

  ctx.font=`italic 300 ${S*19}px Georgia,serif`;
  ctx.fillStyle='rgba(80,200,255,0.80)'; ctx.fillText('G+Link Card™', cx, S*422);

  ctx.strokeStyle=hGrad(0.40); ctx.lineWidth=S*0.8;
  ctx.beginPath(); ctx.moveTo(S*50,S*436); ctx.lineTo(W-S*50,S*436); ctx.stroke();

  ctx.font=`italic 300 ${S*14}px Georgia,serif`;
  ctx.fillStyle='rgba(144,210,255,0.88)';
  ctx.fillText('Digital Business Cards', cx, S*458);
  ctx.fillText('for the Elite Professional', cx, S*477);

  // PILLS — dynamic width
  ctx.font=`400 ${S*10}px "Arial Narrow",Arial,sans-serif`;
  const pillData=['Cinematic Video','Custom Score','QR Access'];
  const pillH=S*28, pillR=S*14, pillGap=S*14, dotPad=S*36;
  const pillWidths=pillData.map(t=>ctx.measureText(t).width+dotPad+S*14);
  const totalPillW=pillWidths.reduce((a,b)=>a+b,0)+pillGap*(pillData.length-1);
  let px=cx-totalPillW/2;
  const pillY=S*490;

  pillData.forEach((label,i)=>{
    const pw=pillWidths[i];
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(px,pillY,pw,pillH,pillR);
    else ctx.rect(px,pillY,pw,pillH);
    ctx.fillStyle='rgba(5,14,30,0.92)'; ctx.fill();
    ctx.strokeStyle='rgba(80,200,255,0.50)'; ctx.lineWidth=S*0.8; ctx.stroke();
    ctx.beginPath(); ctx.arc(px+S*13,pillY+pillH/2,S*3.5,0,Math.PI*2);
    ctx.fillStyle='#50C8FF'; ctx.fill();
    ctx.textAlign='left';
    ctx.font=`400 ${S*10}px "Arial Narrow",Arial,sans-serif`;
    ctx.fillStyle='#FFFFFF';
    ctx.fillText(label, px+S*24, pillY+pillH/2+S*3.5);
    px+=pw+pillGap;
  });

  // CTA BUTTON
  ctx.textAlign='center';
  const bx=S*58,by=S*532,bw=S*284,bh=S*47,br=S*6;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(bx,by,bw,bh,br); else ctx.rect(bx,by,bw,bh);
  ctx.fillStyle='rgba(5,14,32,0.88)'; ctx.fill();
  ctx.strokeStyle='rgba(80,200,255,0.70)'; ctx.lineWidth=S*1.2; ctx.stroke();
  const btnG=ctx.createLinearGradient(bx,by,bx+bw,by+bh);
  btnG.addColorStop(0,'rgba(80,200,255,0.03)'); btnG.addColorStop(0.5,'rgba(80,200,255,0.09)'); btnG.addColorStop(1,'rgba(80,200,255,0.03)');
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(bx,by,bw,bh,br); else ctx.rect(bx,by,bw,bh);
  ctx.fillStyle=btnG; ctx.fill();
  ctx.font=`700 ${S*14}px "Arial Narrow",Arial,sans-serif`;
  ctx.fillStyle='#FFFFFF'; ctx.fillText('GET YOUR G+LINK CARD  →', cx, by+bh/2+S*5);

  // BOTTOM TICKER
  const tickerH=S*42, tickerY=H-tickerH;
  ctx.fillStyle='rgba(3,7,16,0.92)'; ctx.fillRect(0,tickerY,W,tickerH);
  ctx.strokeStyle=hGrad(0.38); ctx.lineWidth=S*0.7;
  ctx.beginPath(); ctx.moveTo(0,tickerY); ctx.lineTo(W,tickerY); ctx.stroke();
  ctx.font=`700 ${S*9}px "Arial Narrow",Arial,sans-serif`;
  ctx.fillStyle='rgba(80,200,255,0.70)';
  ctx.fillText('G+LINK CARD  —  ACCESS GRANTED  —  G+LINK CARD  —  ACCESS GRANTED', cx, tickerY+tickerH/2+S*3.5);
}

const img=new Image();
img.onload=()=>{
  drawStory(img);
  // Enable download button once drawn
  document.getElementById('dlBtn').addEventListener('click', ()=>{
    const link=document.createElement('a');
    link.download='GLink-Card-Facebook-Story.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
  });
};
img.onerror=()=>{
